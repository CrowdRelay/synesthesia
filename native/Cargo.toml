[workspace]
resolver = "2"
members = ["synesthesia-core", "synesthesia-gdext"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.94"

[workspace.dependencies]
godot = { version = "=0.5.5" }
synesthesia-core = { path = "synesthesia-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
