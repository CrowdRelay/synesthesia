[build]
  command = "./scripts/build-web-preview.sh"
  publish = "build/web"
  ignore = "test \"${CONTEXT:-production}\" != \"production\""

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.13"
  SYNESTHESIA_RUST_WEB_REQUIRED = "1"
  SYNESTHESIA_RUST_WEB_TOOLCHAIN = "nightly-2026-08-07"

[[redirects]]
  from = "/reward"
  to = "/reward/"
  status = 301
