[build]
  publish = "build/web"

  # GitHub Actions is the only production builder. Netlify's linked Git build
  # is intentionally skipped; keep Build status set to "Stopped builds" too.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/reward"
  to = "/reward/"
  status = 301
