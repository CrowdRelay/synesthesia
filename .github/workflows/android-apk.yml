name: Android APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: synesthesia-android-apk-${{ github.event.workflow_run.actor.login || github.actor }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build arm64 debug APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      ANDROID_DEBUG_KEYSTORE_USER_SECRET: ${{ secrets.ANDROID_DEBUG_KEYSTORE_USER }}
      ANDROID_DEBUG_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
      SYNESTHESIA_ANDROID_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Check out exact validated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate canonical source contracts for manual builds
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/validate-source.sh

      - name: Bind workflow-run build to CI-validated source
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          test "${SOURCE_SHA}" = "${{ github.event.workflow_run.head_sha }}"
          echo "SYNESTHESIA_ANDROID_SOURCE_PROVENANCE=CI_VALIDATED sha=${SOURCE_SHA}"

      - name: Cache bounded Rust and Godot build inputs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ~/.cache/synesthesia/godot-4.7.1-stable/editor.zip
            ~/.local/share/godot/export_templates/4.7.1.stable/android_debug.apk
            ~/.local/share/godot/export_templates/4.7.1.stable/android_release.apk
          key: ${{ runner.os }}-synesthesia-android-rust1.97.1-ndk4.1.2-godot4.7.1-${{ hashFiles('native/Cargo.lock') }}

      - name: Set up Rust Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
          rustup target add aarch64-linux-android
          if ! (cd native && cargo ndk --version 2>/dev/null) | grep -Fq 'cargo-ndk 4.1.2'; then
            cargo install cargo-ndk --locked --version 4.1.2
          else
            echo 'SYNESTHESIA_CARGO_NDK_CACHE=HIT version=4.1.2'
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Configure optional stable signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_DEBUG_KEYSTORE_BASE64}" ]]; then
            echo "No stable signing secret configured; this run will use an ephemeral debug key."
            exit 0
          fi
          if [[ -z "${ANDROID_DEBUG_KEYSTORE_USER_SECRET}" || -z "${ANDROID_DEBUG_KEYSTORE_PASSWORD_SECRET}" ]]; then
            echo "ANDROID_DEBUG_KEYSTORE_BASE64 requires USER and PASSWORD secrets too." >&2
            exit 1
          fi
          key_path="${RUNNER_TEMP}/synesthesia-debug.keystore"
          printf '%s' "${ANDROID_DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${key_path}"
          chmod 600 "${key_path}"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=${key_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_DEBUG_KEYSTORE_USER=${ANDROID_DEBUG_KEYSTORE_USER_SECRET}" >> "${GITHUB_ENV}"
          echo "ANDROID_DEBUG_KEYSTORE_PASSWORD=${ANDROID_DEBUG_KEYSTORE_PASSWORD_SECRET}" >> "${GITHUB_ENV}"

      - name: Build and verify APK
        shell: bash
        env:
          SYNESTHESIA_GODOT_LOG_DIR: build/ci-logs
          SYNESTHESIA_DISABLE_RUST_NATIVE: "0"
          SYNESTHESIA_SKIP_SOURCE_VALIDATION: "1"
        run: ./scripts/build-android-apk.sh

      - name: Bind Android artifact to source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/artifact_manifest.py create build/android build/android-artifact-manifest.json --source-sha "${SOURCE_SHA}"
          python3 tools/artifact_manifest.py verify build/android build/android-artifact-manifest.json --source-sha "${SOURCE_SHA}"

      - name: Upload Godot validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synesthesia-android-godot-logs-${{ env.SOURCE_SHA }}
          path: build/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synesthesia-android-debug-${{ env.SOURCE_SHA }}
          path: |
            build/android/synesthesia-debug.apk
            build/android/synesthesia-debug.apk.sha256
            build/android/synesthesia-debug.apk.badging.txt
            build/android-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14
