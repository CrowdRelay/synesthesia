name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_EDITOR_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
  GODOT_EDITOR_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          test -d scenes
          test -d scripts
          test -d tests
          test ! -d virya-synestezja

      - name: Validate Python tools and project contracts
        run: |
          set -euo pipefail
          ./scripts/validate-source.sh

      - name: Cache Rust dependency sources
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-synesthesia-rust-1.97.1-${{ hashFiles('native/Cargo.lock') }}

      - name: Cache verified Godot and Web inputs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            .cache/godot-${{ env.GODOT_VERSION }}/editor.zip
            .cache/godot-${{ env.GODOT_VERSION }}/web-templates/4.7.1.stable/.synesthesia-web-templates.sha256
            .cache/godot-${{ env.GODOT_VERSION }}/web-templates/4.7.1.stable/web_dlink_nothreads_debug.zip
            .cache/godot-${{ env.GODOT_VERSION }}/web-templates/4.7.1.stable/web_dlink_nothreads_release.zip
          key: ${{ runner.os }}-synesthesia-godot-web-${{ env.GODOT_VERSION }}-${{ env.GODOT_EDITOR_SHA256 }}-v5

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Validate pure Rust core and GDExtension adapter
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --manifest-path native/Cargo.toml --all -- --check
          cargo +1.97.1 test --manifest-path native/Cargo.toml --package synesthesia-core
          cargo +1.97.1 clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Install verified Godot editor
        shell: bash
        run: |
          set -euo pipefail
          archive="${GITHUB_WORKSPACE}/.cache/godot-${GODOT_VERSION}/editor.zip"
          install_dir="${RUNNER_TEMP}/godot-${GODOT_VERSION}"
          mkdir -p "$(dirname "${archive}")"

          if [[ ! -s "${archive}" ]]; then
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --output "${archive}" \
              "${GODOT_EDITOR_URL}"
          else
            echo "SYNESTHESIA_GODOT_EDITOR_CACHE=HIT archive=${archive}"
          fi

          echo "${GODOT_EDITOR_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          chmod +x "${install_dir}/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=${install_dir}/Godot_v${GODOT_VERSION}_linux.x86_64" >> "${GITHUB_ENV}"

      - name: Print engine version
        run: |
          "${GODOT_BIN}" --version

      - name: Build native Rust backend for engine smoke
        shell: bash
        run: |
          set -euo pipefail
          rustup override set 1.97.1
          SYNESTHESIA_RUST_PROFILE=debug ./scripts/build-rust-native.sh host

      - name: Run shared hardened Godot validation
        shell: bash
        env:
          SYNESTHESIA_GODOT_LOG_DIR: build/ci-logs
          SYNESTHESIA_SKIP_SOURCE_VALIDATION: "1"
        run: |
          set -euo pipefail
          GODOT_BIN="${GODOT_BIN}" ./validate.sh

      - name: Upload Godot validation diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-ci-godot-logs-${{ github.sha }}
          path: build/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare pinned bundled fonts for production Web
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/prepare-bundled-fonts.sh
          test -s assets/fonts/generated/SynesthesiaTitle.ttf
          test -s assets/fonts/generated/SynesthesiaDisplay.ttf
          test -s assets/fonts/generated/OFL-NewRocker.txt
          test -s assets/fonts/generated/OFL-BebasNeue.txt

      - name: Build production Web artifact once
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          SYNESTHESIA_RUST_WEB_REQUIRED: "0"
          SYNESTHESIA_SKIP_SOURCE_VALIDATION: "1"
        run: ./scripts/build-web-preview.sh

      - name: Verify production Web artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/_headers
          test -s build/web/_redirects
          test -s build/web/manifest.webmanifest
          test -s build/web/service-worker.js
          test -n "$(find build/web -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          test -n "$(find build/web -maxdepth 1 -type f -name '*.pck' -print -quit)"
          test -z "$(find build/web -type f -name 'synesthesia_gdext.wasm' -print -quit)"
          python3 tools/artifact_manifest.py create build/web build/web-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 tools/artifact_manifest.py verify build/web build/web-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 tools/write_release_provenance.py \
            --source-sha "${GITHUB_SHA}" \
            --lockfile native/Cargo.lock \
            --artifact-manifest build/web-artifact-manifest.json \
            --output build/web-release-provenance.json
          python3 tools/web_artifact_metrics.py build/web build/web-metrics.json
          echo "SYNESTHESIA_WEB_PROMOTION_ARTIFACT=PASS files=$(find build/web -type f | wc -l | tr -d ' ')"

      - name: Compare Web artifact with previous successful main build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/previous-metrics
          previous_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=10" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [[ -n "${previous_run}" ]]; then
            gh run download "${previous_run}" --repo "${GITHUB_REPOSITORY}" -n synesthesia-web-metrics -D build/previous-metrics >/dev/null 2>&1 || true
          fi
          if [[ -s build/previous-metrics/web-metrics.json ]]; then
            python3 tools/compare_web_artifact_metrics.py build/web-metrics.json build/previous-metrics/web-metrics.json
          else
            echo "SYNESTHESIA_WEB_REGRESSION=BASELINE_PENDING"
          fi

      - name: Upload Web performance baseline
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-web-metrics
          path: build/web-metrics.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload CI-proven Web promotion artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-web-${{ github.sha }}
          path: |
            build/web
            build/web-artifact-manifest.json
            build/web-release-provenance.json
            tools/artifact_manifest.py
            tools/write_release_provenance.py
          if-no-files-found: error
          retention-days: 14
