name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_EDITOR_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
  GODOT_EDITOR_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          test -d scenes
          test -d scripts
          test -d tests
          test ! -d virya-synestezja

      - name: Validate Python tools and project contracts
        run: |
          set -euo pipefail
          ./scripts/validate-source.sh

      - name: Cache Rust dependency sources
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-synesthesia-rust-1.97.1-${{ hashFiles('native/Cargo.lock') }}

      - name: Cache verified Godot editor archive
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .ci-cache/godot/editor-${{ env.GODOT_VERSION }}.zip
          key: ${{ runner.os }}-synesthesia-godot-editor-${{ env.GODOT_VERSION }}-${{ env.GODOT_EDITOR_SHA256 }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Validate pure Rust core and GDExtension adapter
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --manifest-path native/Cargo.toml --all -- --check
          cargo +1.97.1 test --manifest-path native/Cargo.toml --package synesthesia-core
          cargo +1.97.1 clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Install verified Godot editor
        shell: bash
        run: |
          set -euo pipefail
          archive="${GITHUB_WORKSPACE}/.ci-cache/godot/editor-${GODOT_VERSION}.zip"
          install_dir="${RUNNER_TEMP}/godot-${GODOT_VERSION}"
          mkdir -p "$(dirname "${archive}")"

          if [[ ! -s "${archive}" ]]; then
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --output "${archive}" \
              "${GODOT_EDITOR_URL}"
          else
            echo "SYNESTHESIA_GODOT_EDITOR_CACHE=HIT archive=${archive}"
          fi

          echo "${GODOT_EDITOR_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          chmod +x "${install_dir}/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=${install_dir}/Godot_v${GODOT_VERSION}_linux.x86_64" >> "${GITHUB_ENV}"

      - name: Print engine version
        run: |
          "${GODOT_BIN}" --version

      - name: Build native Rust backend for engine smoke
        shell: bash
        run: |
          set -euo pipefail
          rustup override set 1.97.1
          SYNESTHESIA_RUST_PROFILE=debug ./scripts/build-rust-native.sh host

      - name: Run shared hardened Godot validation
        shell: bash
        env:
          SYNESTHESIA_GODOT_LOG_DIR: build/ci-logs
          SYNESTHESIA_SKIP_SOURCE_VALIDATION: "1"
        run: |
          set -euo pipefail
          GODOT_BIN="${GODOT_BIN}" ./validate.sh

      - name: Upload Godot validation diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-ci-godot-logs-${{ github.sha }}
          path: build/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
