name: Promote CI Web artifact to Netlify

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run id containing the Web artifact
        required: true
      source_sha:
        description: Full 40-character source SHA produced by that CI run
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: synesthesia-netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Promote exact CI artifact without rebuilding
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.actor.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Resolve validated CI artifact
        id: source
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN_ID: ${{ inputs.ci_run_id }}
          MANUAL_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            run_id="${WORKFLOW_RUN_ID}"
            source_sha="${WORKFLOW_SHA}"
          else
            run_id="${MANUAL_RUN_ID}"
            source_sha="${MANUAL_SHA}"
          fi
          [[ "${run_id}" =~ ^[0-9]+$ ]]
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "SYNESTHESIA_DEPLOY_SOURCE=${source_sha} ci_run=${run_id}"

      - name: Download exact CI-proven Web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: synesthesia-web-${{ steps.source.outputs.sha }}
          path: promoted
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify artifact manifest and deploy surface
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -s promoted/build/web/index.html
          test -s promoted/build/web/_headers
          test -s promoted/build/web/_redirects
          test -s promoted/build/web/manifest.webmanifest
          test -s promoted/build/web/service-worker.js
          test -s promoted/build/web-artifact-manifest.json
          test -s promoted/build/web-release-provenance.json
          test -s promoted/tools/artifact_manifest.py
          test -s promoted/tests/e2e/full_game_web.py
          test -n "$(find promoted/build/web -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          test -n "$(find promoted/build/web -maxdepth 1 -type f -name '*.pck' -print -quit)"
          test -z "$(find promoted/build/web -type f \( -name 'synesthesia_gdext.wasm' -o -name '*.side.wasm' \) -print -quit)"
          python3 promoted/tools/artifact_manifest.py verify \
            promoted/build/web \
            promoted/build/web-artifact-manifest.json \
            --source-sha "${SOURCE_SHA}"
          python3 - promoted/build/web-release-provenance.json "${SOURCE_SHA}" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          if data.get("sourceSha") != sys.argv[2]: raise SystemExit("release provenance source mismatch")
          for key in ("dependencyLockSha256", "artifactManifestSha256"):
              if not re.fullmatch(r"[0-9a-f]{64}", str(data.get(key, ""))):
                  raise SystemExit(f"invalid {key}")
          print("SYNESTHESIA_NETLIFY_ARTIFACT=PASS source=" + data["sourceSha"] + " rebuild=false")
          PY

      - name: Verify Netlify source builds are stopped
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN}"
          test -n "${NETLIFY_SITE_ID}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" \
            -o "${RUNNER_TEMP}/netlify-site.json"
          python3 - "${RUNNER_TEMP}/netlify-site.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          data = json.loads(Path(sys.argv[1]).read_text())
          stopped = bool((data.get("build_settings") or {}).get("stop_builds"))
          if not stopped:
              raise SystemExit(
                  "SYNESTHESIA_NETLIFY_ZERO_BUILD=FAIL reason=source-builds-active "
                  "action='Netlify > Project configuration > Build & deploy > Build settings > Stopped builds'"
              )
          print("SYNESTHESIA_NETLIFY_ZERO_BUILD=PASS source_builds=stopped deploy=artifact-promotion")
          PY

      - name: Refuse stale production promotion
        id: freshness
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          [[ "${current_sha}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${current_sha}" == "${SOURCE_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
            echo "SYNESTHESIA_DEPLOY_FRESHNESS=PASS sha=${SOURCE_SHA}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "SYNESTHESIA_DEPLOY_FRESHNESS=SKIP artifact=${SOURCE_SHA} main=${current_sha}"
          fi

      - name: Setup Node.js for Netlify CLI
        if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Promote exact prebuilt artifact to Netlify production
        if: steps.freshness.outputs.current == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npx --yes netlify-cli@26.2.0 deploy \
            --prod \
            --no-build \
            --dir=promoted/build/web \
            --site="${NETLIFY_SITE_ID}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="GitHub Actions artifact ${SOURCE_SHA}"

      - name: Report Synesthesia release to CrowdRelay ledger
        if: steps.freshness.outputs.current == 'true'
        continue-on-error: true
        env:
          CROWDRELAY_BASE_URL: ${{ secrets.CROWDRELAY_BASE_URL }}
          CROWDRELAY_COMMERCE_API_KEY: ${{ secrets.CROWDRELAY_COMMERCE_API_KEY }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROWDRELAY_BASE_URL:-}" || -z "${CROWDRELAY_COMMERCE_API_KEY:-}" ]]; then
            echo "SYNESTHESIA_RELEASE_LEDGER=SKIP reason=not-configured"
            exit 0
          fi
          lock_sha="$(jq -r '.dependencyLockSha256' promoted/build/web-release-provenance.json)"
          manifest_sha="$(jq -r '.artifactManifestSha256' promoted/build/web-release-provenance.json)"
          [[ "${lock_sha}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${manifest_sha}" =~ ^[0-9a-f]{64}$ ]]
          jq -n --arg sha "${SOURCE_SHA}" --arg ref "${GITHUB_RUN_ID}" --arg lock "${lock_sha}" --arg artifact_manifest "${manifest_sha}" '{component_key:"synesthesia",environment:"production",source_sha:$sha,artifact_digest:("sha256:"+$artifact_manifest),deploy_ref:$ref,version:null,manifest_sha:null,metadata:{reporter:"github-actions",dependency_lock_sha256:$lock,artifact_manifest_sha256:$artifact_manifest},observed_at:(now|todateiso8601)}' | \
            curl --fail-with-body --silent --show-error --max-time 15 \
              -H 'content-type: application/json' \
              -H "Authorization: Bearer ${CROWDRELAY_COMMERCE_API_KEY}" \
              --data-binary @- "${CROWDRELAY_BASE_URL%/}/v1/internal/autopilot/release-components"
          echo "SYNESTHESIA_RELEASE_LEDGER=PASS sha=${SOURCE_SHA}"
