name: Upstream contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/reward_client.gd"
      - "web/_headers"
      - ".github/workflows/upstream-contract.yml"
  pull_request:
    paths:
      - "scripts/reward_client.gd"
      - "web/_headers"
      - ".github/workflows/upstream-contract.yml"

permissions:
  contents: read

concurrency:
  group: synesthesia-upstream-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crowdrelay:
    name: CrowdRelay compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Synesthesia under canonical ecosystem layout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: synesthesia

      - name: Check out current CrowdRelay main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: wojciechbator/crowdrelay
          ref: main
          path: crowdrelay
          persist-credentials: false

      - name: Verify Synesthesia against current upstream run contract and CSP
        run: python3 crowdrelay/scripts/test-ecosystem-contract-v2.py
