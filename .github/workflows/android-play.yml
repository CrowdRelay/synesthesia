name: Android Google Play

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: Google Play track
        required: true
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: synesthesia-google-play-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  play:
    name: Build signed AAB and publish Google Play
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.play_track == 'production' && 'production' || 'store-testing' }}
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out exact validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Resolve release identity and track
        env:
          INPUT_TRACK: ${{ inputs.play_track }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(awk '/\[preset\.3\.options\]/{p=1;next} p && /^version\/name=/{gsub(/^version\/name="|"$/,""); print; exit}' export_presets.cfg)"
          test -n "${version_name}"
          version_code=$((100000000 + GITHUB_RUN_NUMBER))
          (( version_code >= 1 && version_code <= 2100000000 ))
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            play_track="internal"
          else
            play_track="${INPUT_TRACK}"
          fi
          case "${play_track}" in internal|alpha|beta|production) ;; *) exit 2 ;; esac
          if [[ "${play_track}" == "production" ]]; then
            play_status="inProgress"
            user_fraction="0.10"
          else
            play_status="completed"
            user_fraction=""
          fi
          echo "SYNESTHESIA_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "SYNESTHESIA_ANDROID_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "SYNESTHESIA_PLAY_TRACK=${play_track}" >> "$GITHUB_ENV"
          echo "SYNESTHESIA_PLAY_STATUS=${play_status}" >> "$GITHUB_ENV"
          echo "SYNESTHESIA_PLAY_USER_FRACTION=${user_fraction}" >> "$GITHUB_ENV"
          echo "SYNESTHESIA_PLAY_RELEASE=PASS version=${version_name} versionCode=${version_code} track=${play_track} status=${play_status} sha=${SOURCE_SHA}"

      - name: Bind release to CI-validated source
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          test "${SOURCE_SHA}" = "${{ github.event.workflow_run.head_sha }}"
          echo "SYNESTHESIA_PLAY_SOURCE=CI_VALIDATED sha=${SOURCE_SHA}"

      - name: Validate source contracts for manual release
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/validate-source.sh

      - name: Require exact main CI before manual production release
        if: github.event_name == 'workflow_dispatch' && inputs.play_track == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          for attempt in $(seq 1 60); do
            row="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${SOURCE_SHA}" --limit 1 --json status,conclusion,headSha,databaseId --jq '.[0] // empty' 2>/dev/null || true)"
            if [[ -z "${row}" ]]; then sleep 15; continue; fi
            [[ "$(jq -r '.headSha' <<<"${row}")" == "${SOURCE_SHA}" ]]
            status="$(jq -r '.status' <<<"${row}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${row}")"
            if [[ "${status}" != "completed" ]]; then sleep 15; continue; fi
            [[ "${conclusion}" == "success" ]] || { echo "SYNESTHESIA_PLAY_CI_GATE=FAIL conclusion=${conclusion}" >&2; exit 1; }
            echo "SYNESTHESIA_PLAY_CI_GATE=PASS run=$(jq -r '.databaseId' <<<"${row}") sha=${SOURCE_SHA}"
            exit 0
          done
          echo "SYNESTHESIA_PLAY_CI_GATE=FAIL reason=timeout sha=${SOURCE_SHA}" >&2
          exit 1

      - name: Validate release secrets and Google Play authentication policy
        env:
          WIF_PROVIDER: ${{ vars.GOOGLE_PLAY_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo 'Missing ANDROID_KEYSTORE_BASE64' >&2; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo 'Missing ANDROID_KEY_ALIAS' >&2; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo 'Missing ANDROID_KEY_PASSWORD' >&2; exit 1; }

          wif=false
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            wif=true
          elif [[ -n "${WIF_PROVIDER}" || -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            echo 'SYNESTHESIA_PLAY_AUTH=FAIL reason=partial-wif-configuration' >&2
            exit 1
          fi
          if [[ "${SYNESTHESIA_PLAY_TRACK}" == "production" && "${wif}" != true ]]; then
            echo 'SYNESTHESIA_PLAY_AUTH=FAIL reason=production-requires-wif' >&2
            exit 1
          fi
          if [[ "${wif}" != true ]]; then
            test -n "${PLAY_JSON}" || { echo 'Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON and WIF configuration' >&2; exit 1; }
            jq -e '.type == "service_account" and (.client_email | type == "string") and (.private_key | type == "string")' <<<"${PLAY_JSON}" >/dev/null
          fi
          echo "SYNESTHESIA_PLAY_AUTH=PASS mode=$([[ "${wif}" == true ]] && echo wif || echo json-fallback) track=${SYNESTHESIA_PLAY_TRACK}"

      - name: Require production CrowdRelay and Synesthesia surfaces
        if: github.event_name == 'workflow_dispatch' && inputs.play_track == 'production'
        env:
          CROWDRELAY_BASE_URL: ${{ secrets.CROWDRELAY_BASE_URL }}
          SYNESTHESIA_BASE_URL: ${{ vars.SYNESTHESIA_PRODUCTION_BASE_URL || 'https://synesthesia.virya.music' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CROWDRELAY_BASE_URL}" || { echo 'SYNESTHESIA_PLAY_PREFLIGHT=FAIL crowdrelay-base-missing' >&2; exit 1; }
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --connect-timeout 4 --max-time 10 --retry 2 --retry-all-errors \
            "${CROWDRELAY_BASE_URL%/}/v1/meta" | jq -e '.apiVersion == "1" and .capabilities.synesthesia_runs_v1 and .capabilities.synesthesia_rewards_v1 and .capabilities.synesthesia_leaderboard_v1 and .capabilities.synesthesia_recovery_v1' >/dev/null
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --connect-timeout 4 --max-time 10 --retry 2 --retry-all-errors \
            "${SYNESTHESIA_BASE_URL%/}/menu-world.webp" >/dev/null
          echo 'SYNESTHESIA_PLAY_PREFLIGHT=PASS'

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: google-auth
        if: vars.GOOGLE_PLAY_WIF_PROVIDER != '' && vars.GOOGLE_PLAY_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Materialize legacy Play JSON fallback
        id: play-json
        if: vars.GOOGLE_PLAY_WIF_PROVIDER == '' && vars.GOOGLE_PLAY_SERVICE_ACCOUNT == ''
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          path="${RUNNER_TEMP}/google-play-service-account.json"
          printf '%s' "${PLAY_JSON}" > "${path}"
          chmod 600 "${path}"
          jq -e '.type == "service_account"' "${path}" >/dev/null
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Resolve Google Play credentials file
        id: play-credentials
        env:
          WIF_PATH: ${{ steps.google-auth.outputs.credentials_file_path }}
          JSON_PATH: ${{ steps.play-json.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          path="${WIF_PATH:-${JSON_PATH:-}}"
          test -n "${path}" && test -s "${path}"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache bounded Rust and Godot build inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ~/.cache/synesthesia/godot-4.7.1-stable/editor.zip
            ~/.local/share/godot/export_templates/4.7.1.stable/android_debug.apk
            ~/.local/share/godot/export_templates/4.7.1.stable/android_release.apk
            ~/.local/share/godot/export_templates/4.7.1.stable/android_source.zip
          key: ${{ runner.os }}-synesthesia-play-rust1.97.1-ndk4.1.2-godot4.7.1-${{ hashFiles('native/Cargo.lock') }}

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Rust Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.97.1
          if ! (cd native && cargo ndk --version 2>/dev/null) | grep -Fq 'cargo-ndk 4.1.2'; then
            cargo install cargo-ndk --locked --version 4.1.2
          else
            echo 'SYNESTHESIA_CARGO_NDK_CACHE=HIT version=4.1.2'
          fi

      - name: Configure release upload key
        shell: bash
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/synesthesia-upload.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${key_path}"
          chmod 600 "${key_path}"
          keytool -list -keystore "${key_path}" -storepass "${ANDROID_KEY_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" >/dev/null
          echo "ANDROID_RELEASE_KEYSTORE_PATH=${key_path}" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEYSTORE_USER=${ANDROID_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEYSTORE_PASSWORD=${ANDROID_KEY_PASSWORD}" >> "$GITHUB_ENV"
          echo 'SYNESTHESIA_UPLOAD_KEY=PASS'

      - name: Build and verify exact signed AAB
        shell: bash
        env:
          CI: "true"
          SYNESTHESIA_GODOT_LOG_DIR: build/ci-logs
        run: bash ./scripts/build-android-play-aab.sh

      - name: Bind AAB to exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promoted
          cp build/android/synesthesia-release.aab promoted/synesthesia-release.aab
          cp build/android/synesthesia-release.aab.sha256 promoted/synesthesia-release.aab.sha256
          python3 tools/artifact_manifest.py create promoted android-artifact-manifest.json --source-sha "${SOURCE_SHA}"
          python3 tools/artifact_manifest.py verify promoted android-artifact-manifest.json --source-sha "${SOURCE_SHA}"
          echo "SYNESTHESIA_PLAY_ARTIFACT=PASS sha=${SOURCE_SHA} version=${SYNESTHESIA_VERSION_NAME} versionCode=${SYNESTHESIA_ANDROID_VERSION_CODE}"

      - name: Purge stale artifacts before upload
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | select(.created_at < (now - 7200 | strftime("%Y-%m-%dT%H:%M:%SZ"))) | .id" 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale artifact(s)"

      - name: Upload exact AAB artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-google-play-${{ env.SOURCE_SHA }}
          path: |
            promoted/synesthesia-release.aab
            promoted/synesthesia-release.aab.sha256
            android-artifact-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.play-credentials.outputs.path }}
          packageName: music.virya.synesthesia
          releaseFiles: promoted/synesthesia-release.aab
          tracks: ${{ env.SYNESTHESIA_PLAY_TRACK }}
          status: ${{ env.SYNESTHESIA_PLAY_STATUS }}
          userFraction: ${{ env.SYNESTHESIA_PLAY_USER_FRACTION }}
          releaseName: Synesthesia ${{ env.SYNESTHESIA_VERSION_NAME }} · CI ${{ github.run_number }}
          whatsNewDirectory: distribution/whatsnew

      - name: Publish receipt
        shell: bash
        run: |
          echo "GOOGLE_PLAY_UPLOAD=PASS package=music.virya.synesthesia track=${SYNESTHESIA_PLAY_TRACK} status=${SYNESTHESIA_PLAY_STATUS} version=${SYNESTHESIA_VERSION_NAME} versionCode=${SYNESTHESIA_ANDROID_VERSION_CODE} sha=${SOURCE_SHA}"

      - name: Upload Godot diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-play-godot-logs-${{ env.SOURCE_SHA }}
          path: build/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
