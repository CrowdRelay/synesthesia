name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        required: true
        default: all
        options:
          - all
          - desktop-web
          - android
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_DIR: .
  GODOT_EDITOR_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
  GODOT_TEMPLATES_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz

jobs:
  desktop-web:
    name: Linux and Web
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'desktop-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate project contracts
        run: |
          set -euo pipefail
          python3 -m compileall -q tests tools
          python3 tests/static_validate.py
          python3 tools/perf_budget.py
          python3 tools/audio_mix_budget.py
          python3 tests/room_pipeline_contract.py
          python3 tests/visual_snapshot_contract.py
          python3 tests/new_release_pack_contract.py

      - name: Export Linux and Web builds
        id: export
        uses: firebelley/godot-export@930577654862a320eef793f399ee911b4479efb9 # v7.0.0
        with:
          godot_executable_download_url: ${{ env.GODOT_EDITOR_URL }}
          godot_export_templates_download_url: ${{ env.GODOT_TEMPLATES_URL }}
          relative_project_path: ${{ env.PROJECT_DIR }}
          presets_to_export: Linux,Web
          archive_output: true
          cache: true

      - name: Upload Linux and Web artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-desktop-web-${{ github.sha }}
          path: ${{ steps.export.outputs.archive_directory }}/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android debug APK
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate project contracts
        run: |
          set -euo pipefail
          python3 -m compileall -q tests tools
          python3 tests/static_validate.py
          python3 tools/perf_budget.py
          python3 tools/audio_mix_budget.py
          python3 tests/room_pipeline_contract.py
          python3 tests/visual_snapshot_contract.py
          python3 tests/new_release_pack_contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Create development signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.android"
          if [[ ! -f "${HOME}/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "${HOME}/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Virya,C=PL"
          fi

      - name: Export Android debug APK
        id: export
        uses: firebelley/godot-export@930577654862a320eef793f399ee911b4479efb9 # v7.0.0
        with:
          godot_executable_download_url: ${{ env.GODOT_EDITOR_URL }}
          godot_export_templates_download_url: ${{ env.GODOT_TEMPLATES_URL }}
          relative_project_path: ${{ env.PROJECT_DIR }}
          presets_to_export: Android Debug
          export_debug: true
          archive_output: true
          cache: true

      - name: Upload Android artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-android-${{ github.sha }}
          path: ${{ steps.export.outputs.archive_directory }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop-web
      - android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: synesthesia-*
          path: release-artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release-artifacts/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts found" >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${artifacts[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" \
              --title "VIRYA: Synestezja ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
