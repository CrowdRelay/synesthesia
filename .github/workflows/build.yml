name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        required: true
        default: all
        options:
          - all
          - desktop-web
          - android
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate release source once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate canonical source contracts
        run: ./scripts/validate-source.sh

  desktop-web:
    name: Linux and Web
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'desktop-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: validate-source

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache bounded Web build inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/godot-4.7.1-stable/editor.zip
            .cache/godot-4.7.1-stable/web-templates/4.7.1.stable/.synesthesia-web-templates.sha256
            .cache/godot-4.7.1-stable/web-templates/4.7.1.stable/web_dlink_nothreads_debug.zip
            .cache/godot-4.7.1-stable/web-templates/4.7.1.stable/web_dlink_nothreads_release.zip
            .cache/godot-4.7.1-stable/web-templates/4.7.1.stable/web_nothreads_debug.zip
            .cache/godot-4.7.1-stable/web-templates/4.7.1.stable/web_nothreads_release.zip
            ~/.local/share/godot/export_templates/4.7.1.stable/linux_release.x86_64
          key: ${{ runner.os }}-synesthesia-web-rust-${{ hashFiles('native/Cargo.lock') }}-godot4.7.1-emsdk3.1.74

      - name: Build verified Rust-primary Web artifact
        env:
          SYNESTHESIA_RUST_WEB_REQUIRED: "1"
          SYNESTHESIA_RUST_WEB_TOOLCHAIN: nightly-2026-08-07
          SYNESTHESIA_SKIP_SOURCE_VALIDATION: "1"
        run: ./scripts/build-web-preview.sh

      - name: Build verified Rust-primary Linux artifact
        env:
          SYNESTHESIA_SKIP_SOURCE_VALIDATION: "1"
        run: ./scripts/build-linux-release.sh

      - name: Create desktop/Web provenance manifests
        run: |
          python3 tools/artifact_manifest.py create build/web build/web-release-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 tools/artifact_manifest.py verify build/web build/web-release-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 tools/artifact_manifest.py create build/linux build/linux-release-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 tools/artifact_manifest.py verify build/linux build/linux-release-artifact-manifest.json --source-sha "${GITHUB_SHA}"

      - name: Upload Linux and Web artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-desktop-web-${{ github.sha }}
          path: |
            build/web
            build/linux
            build/web-release-artifact-manifest.json
            build/linux-release-artifact-manifest.json
            tools/artifact_manifest.py
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android debug APK
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: validate-source

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache bounded Android build inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ~/.cache/synesthesia/godot-4.7.1-stable/editor.zip
            ~/.local/share/godot/export_templates/4.7.1.stable/android_debug.apk
            ~/.local/share/godot/export_templates/4.7.1.stable/android_release.apk
          key: ${{ runner.os }}-synesthesia-tag-android-rust1.97.1-ndk4.1.2-godot4.7.1-${{ hashFiles('native/Cargo.lock') }}

      - name: Set up Rust Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
          rustup target add aarch64-linux-android
          if ! (cd native && cargo ndk --version 2>/dev/null) | grep -Fq 'cargo-ndk 4.1.2'; then
            cargo install cargo-ndk --locked --version 4.1.2
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Build and verify Android debug APK
        shell: bash
        env:
          SYNESTHESIA_ANDROID_VERSION_CODE: ${{ github.run_number }}
          SYNESTHESIA_DISABLE_RUST_NATIVE: "0"
          SYNESTHESIA_SKIP_SOURCE_VALIDATION: "1"
        run: ./scripts/build-android-apk.sh

      - name: Bind Android artifact to source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/artifact_manifest.py create build/android build/android-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 tools/artifact_manifest.py verify build/android build/android-artifact-manifest.json --source-sha "${GITHUB_SHA}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-android-${{ github.sha }}
          path: |
            build/android/synesthesia-debug.apk
            build/android/synesthesia-debug.apk.sha256
            build/android/synesthesia-debug.apk.badging.txt
            build/android-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop-web
      - android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: synesthesia-*
          path: release-artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release-artifacts/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts found" >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${artifacts[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" \
              --title "VIRYA: Synestezja ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
