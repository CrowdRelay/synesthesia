<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>VIRYA: Synestezja — wysyłka nagrody</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 10%, #172640, #070a11 58%); color: #edf5ff; }
    main { width: min(620px, 100%); padding: 28px; border: 1px solid #72afff44; border-radius: 26px; background: #0c1321f2; box-shadow: 0 30px 90px #0009; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 7vw, 42px); }
    p { color: #b9c9df; line-height: 1.55; }
    form { display: grid; gap: 12px; margin-top: 22px; }
    label { display: grid; gap: 6px; color: #cad8eb; font-size: 14px; }
    input, select, button { width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid #72afff38; background: #141f32; color: #eef6ff; padding: 12px 14px; font: inherit; }
    button { margin-top: 8px; background: #244b78; border-color: #72afff66; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
    .note { font-size: 12px; color: #8fa4bf; }
    #status { min-height: 24px; color: #83c2ff; font-weight: 600; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) { main { padding: 22px; } .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Ostatni krok</h1>
  <p>Potwierdź dane wysyłkowe bezpośrednio w CrowdRelay. Adres nie trafia do Sygnału, n8n ani treści webhooków — jest widoczny wyłącznie w chronionym panelu realizacji nagród.</p>
  <form id="shipping-form" autocomplete="on">
    <label>Imię i nazwisko<input name="recipient_name" autocomplete="name" maxlength="120" required></label>
    <label>Ulica i numer<input name="address_line1" autocomplete="address-line1" maxlength="180" required></label>
    <label>Adres — druga linia<input name="address_line2" autocomplete="address-line2" maxlength="180"></label>
    <div class="row">
      <label>Kod pocztowy<input name="postal_code" autocomplete="postal-code" maxlength="20" required></label>
      <label>Miasto<input name="city" autocomplete="address-level2" maxlength="120" required></label>
    </div>
    <div class="row">
      <label>Kraj
        <select name="country_code" autocomplete="country" required>
          <option value="PL" selected>Polska</option>
          <option value="CZ">Czechy</option>
          <option value="DE">Niemcy</option>
          <option value="SK">Słowacja</option>
          <option value="OTHER">Inny kraj UE</option>
        </select>
      </label>
      <label>Telefon dla przewoźnika<input name="phone" autocomplete="tel" maxlength="40"></label>
    </div>
    <p class="note">Jedna nagroda na zweryfikowany e-mail. Dane będą przechowywane wyłącznie do realizacji i rozliczenia wysyłki.</p>
    <div id="status" role="status" aria-live="polite"></div>
    <button type="submit">Potwierdź wysyłkę płyty</button>
  </form>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  history.replaceState({}, '', location.pathname);
  const form = document.querySelector('#shipping-form');
  const status = document.querySelector('#status');
  const button = form.querySelector('button');
  if (!token) {
    status.textContent = 'Brakuje tokenu potwierdzającego. Otwórz pełny link z wiadomości.';
    button.disabled = true;
    return;
  }
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    status.textContent = 'Zapisuję dane bezpiecznie…';
    const fields = Object.fromEntries(new FormData(form).entries());
    try {
      const response = await fetch('https://signal-api.virya.music/v1/public/synesthesia/reward-claims/confirm', {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, shipping: fields }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.message || 'Nie udało się potwierdzić wysyłki.');
      status.textContent = body.message || 'Gotowe. Damy znać, gdy płyta zostanie wysłana.';
      form.querySelectorAll('input, select').forEach((element) => element.disabled = true);
      button.hidden = true;
    } catch (error) {
      status.textContent = error instanceof Error ? error.message : 'Sygnał jest chwilowo niedostępny.';
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
